name: Quality Checks

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  smoke-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell_name:
          - powershell
          - pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: ${{ matrix.shell_name }}
        run: python -m pip install --disable-pip-version-check "Pillow>=10.0"

      - name: Run smoke tests
        shell: ${{ matrix.shell_name }}
        run: .\scripts\run-smoke-tests.ps1
